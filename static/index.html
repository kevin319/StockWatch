<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>My Stock</title>
    <link href="/static/styles.css" rel="stylesheet">
    <script>
        (function(){var t=localStorage.getItem('sw-theme')||'dark';document.documentElement.setAttribute('data-theme',t)})();
        // 登入守衛：沒有憑證就同步導回登入頁（在 main.js 之前執行，避免先閃出 demo 畫面）
        if(!localStorage.getItem('access_token')){location.replace('/');}
    </script>
</head>
<body>

    <!-- Top Nav -->
    <header class="nav-top">
        <button class="nav-arrow-btn" id="navPrev" onclick="navPrevList()" aria-label="上一個清單" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="nav-title-btn" onclick="toggleWatchlistDrawer()" aria-label="切換清單">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
            <span class="nav-title" id="navWatchlistName">自選股</span>
            <svg class="nav-title-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <button class="nav-arrow-btn" id="navNext" onclick="navNextList()" aria-label="下一個清單" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <span class="nav-update" id="lastUpdateTime">--:--:--</span>
        <div class="nav-actions">
            <button class="nav-icon-btn" id="navChatBtn" onclick="toggleChatWindow()" aria-label="AI 助理">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </button>
            <button class="nav-icon-btn" onclick="toggleSettingsPage()" aria-label="設置">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
            </button>
        </div>
    </header>

    <!-- Hero Card — 市場儀表板 -->
    <div class="hero-card">
        <div class="hero-head">
            <span class="hero-label">市場</span>
            <span class="hero-summary" id="heroSummary">—</span>
        </div>
        <div class="market-board" id="marketClock"></div>
    </div>

    <!-- Watchlist Drawer -->
    <div id="watchlistDrawerWrap" class="drawer-wrap hidden">
        <aside class="drawer-panel" id="watchlistDrawerPanel">
            <div class="drawer-head">我的清單</div>
            <div id="watchlistDrawerList" class="drawer-list"></div>
            <div id="watchlistNewForm" class="drawer-new-form hidden">
                <input type="text" id="newWatchlistInput" maxlength="50" placeholder="清單名稱，按 Enter 建立">
            </div>
            <div class="drawer-foot">
                <button class="drawer-foot-btn" id="drawerManageBtn" onclick="toggleDrawerManageMode()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
                    管理
                </button>
                <button class="drawer-foot-btn" onclick="openGroupManager()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
                    分組
                </button>
                <button class="drawer-foot-btn" onclick="showNewWatchlistForm()">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    新增清單
                </button>
            </div>
        </aside>
        <div class="drawer-scrim" onclick="closeWatchlistDrawer()"></div>
    </div>

    <!-- Stock List -->
    <main class="page-content">
        <div class="v2-card" id="stockListCard">
            <div id="stockList"></div>
        </div>
    </main>

    <!-- Search Bar -->
    <div class="search-bar-wrap">
        <div class="search-field">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="searchInput" placeholder="搜尋股票代號或名稱...">
        </div>
        <div id="searchResults" class="search-results hidden"></div>
    </div>

    <!-- 清單選擇器 -->
    <div id="listPickerWrap" class="picker-wrap hidden">
        <div class="picker-scrim" onclick="closeListPicker()"></div>
        <div class="picker-sheet">
            <div class="picker-head">
                <span class="picker-title">加入清單</span>
                <span class="picker-ticker" id="pickerTicker"></span>
            </div>
            <div id="pickerList" class="picker-list"></div>
            <div class="picker-foot">
                <button class="pill-btn pill-btn-secondary" onclick="closeListPicker()">取消</button>
                <button class="pill-btn pill-btn-primary" onclick="submitListPicker()">完成</button>
            </div>
        </div>
    </div>

    <!-- 分組管理頁 -->
    <div id="groupManagerWrap" class="sheet hidden">
        <div class="sheet-nav">
            <button class="sheet-back" onclick="closeGroupManager()">
                <svg width="10" height="18" viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1L1 9l8 8"/></svg>
                完成
            </button>
            <span class="sheet-title">管理分組</span>
        </div>
        <div id="groupManagerList" class="drawer-list" style="padding:0 16px"></div>
        <div id="groupNewForm" class="drawer-new-form hidden" style="padding:0 16px">
            <input type="text" id="newGroupInput" maxlength="50" placeholder="分組名稱">
            <input type="text" id="newGroupDescInput" class="drawer-desc-input" maxlength="200" placeholder="說明（選填），按 Enter 建立">
        </div>
        <div class="drawer-foot">
            <button class="drawer-foot-btn" onclick="showNewGroupForm()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                新增分組
            </button>
        </div>
    </div>

    <!-- 分組股票選擇器 -->
    <div id="groupStockPickerWrap" class="picker-wrap hidden">
        <div class="picker-scrim" onclick="closeGroupStockPicker()"></div>
        <div class="picker-sheet">
            <div class="picker-head">
                <span class="picker-title">選擇股票</span>
                <span class="picker-ticker" id="groupPickerName"></span>
            </div>
            <div id="groupPickerList" class="picker-list"></div>
            <div class="picker-foot">
                <button class="pill-btn pill-btn-secondary" onclick="closeGroupStockPicker()">取消</button>
                <button class="pill-btn pill-btn-primary" onclick="submitGroupStockPicker()">完成</button>
            </div>
        </div>
    </div>

    <!-- Settings Sheet -->
    <div id="settingsPage" class="sheet hidden">
        <div class="sheet-nav">
            <button class="sheet-back" onclick="toggleSettingsPage()">
                <svg width="10" height="18" viewBox="0 0 10 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 1L1 9l8 8"/></svg>
                完成
            </button>
            <span class="sheet-title">設置</span>
        </div>

        <div class="settings-user-card">
            <img id="userAvatar" class="settings-avatar" src="" alt="">
            <div class="settings-user-info">
                <div class="user-name" id="userName"></div>
                <div class="user-email" id="userEmail"></div>
            </div>
            <button class="pill-btn pill-btn-danger" onclick="logout()">登出</button>
        </div>

        <div class="settings-section">
            <div class="settings-section-title">外觀</div>
            <div class="v2-card">
                <div class="settings-row-simple">
                    <span class="settings-row-label">主題</span>
                    <div class="segmented-control" id="themeToggle">
                        <button class="seg-btn" data-theme="light" onclick="setTheme('light')">淺色</button>
                        <button class="seg-btn active" data-theme="dark" onclick="setTheme('dark')">深色</button>
                        <div class="seg-thumb"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-section-title">股票資訊顯示</div>
            <div class="v2-card">
                <div class="settings-row-simple">
                    <span class="settings-row-label">價格走勢圖</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleChart" onchange="setShowChart(this.checked)">
                        <span class="toggle-track"></span>
                    </label>
                </div>
                <div class="settings-row-simple" style="border-top: 0.5px solid var(--hairline)">
                    <span class="settings-row-label">AI 摘要</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleSummary" onchange="setShowSummary(this.checked)">
                        <span class="toggle-track"></span>
                    </label>
                </div>
                <div class="settings-row-simple" style="border-top: 0.5px solid var(--hairline)">
                    <span class="settings-row-label">分組收合</span>
                    <div class="segmented-control" id="groupCollapseToggle">
                        <button class="seg-btn active" data-mode="all-open" onclick="setGroupCollapseMode('all-open')">全部展開</button>
                        <button class="seg-btn" data-mode="first-open" onclick="setGroupCollapseMode('first-open')">僅首組</button>
                        <div class="seg-thumb"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="settings-section">
            <div class="settings-section-title" id="settingsListTitle">自選股</div>
            <div class="v2-card">
                <div id="settingsStockList"></div>
            </div>
        </div>
        <div class="settings-bottom-pad"></div>
    </div>

    <!-- Chat Sheet -->
    <div id="chatWindow" class="sheet hidden">
        <div class="chat-sheet">
            <div class="sheet-nav">
                <span class="sheet-title">AI 助理</span>
                <button class="nav-icon-btn" onclick="toggleChatWindow()" style="margin-left:auto">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input-bar">
                <input type="text" id="messageInput" class="chat-input"
                       placeholder="輸入訊息..."
                       onkeypress="if(event.key==='Enter')sendMessage()">
                <button class="chat-send-btn" onclick="sendMessage()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        marked.setOptions({ breaks: true, gfm: true });

        window.onload = function() {
            const token = localStorage.getItem('access_token');
            if (!token) { window.location.href = '/'; return; }

            const userInfo = JSON.parse(localStorage.getItem('user_info') || '{}');
            if (userInfo.name) {
                document.getElementById('userName').textContent = userInfo.name;
                document.getElementById('userEmail').textContent = userInfo.email;
                const avatarImg = document.getElementById('userAvatar');
                if (userInfo.picture) {
                    avatarImg.onerror = function() {
                        this.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(userInfo.name) + '&background=0071e3&color=fff&bold=true&size=96';
                    };
                    avatarImg.src = userInfo.picture;
                } else {
                    avatarImg.src = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(userInfo.name) + '&background=0071e3&color=fff&bold=true&size=96';
                }
            }

            fetch('/verify_session?token=' + token, {
                method: 'GET',
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
            })
            .then(r => { if (!r.ok) throw new Error('Session 驗證失敗'); return r.json(); })
            .then(data => { if (!data.valid) logout(); })
            .catch(() => {});
        };

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_info');
            window.location.href = '/';
        }
    </script>
    <script src="/static/watchlists.js"></script>
    <script src="/static/main.js"></script>
</body>
</html>
