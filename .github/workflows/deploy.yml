name: build & deploy

# push 到 main 就在 GitHub 的 arm64 runner 上 build，推到 ghcr.io，
# 再 SSH 進 Oracle VM 拉新版重啟。
#
# 為什麼不在 VM 上 build：VM 只有 1 OCPU，build 很慢；而且那需要把 git
# 憑證放到雲端主機上。改成這裡 build、VM 只負責 pull，VM 不需要原始碼。
#
# 憑證處理：push 用 Actions 內建的 GITHUB_TOKEN（原生具備 packages 權限，
# 不需要自建 PAT）。部署時把同一個「當次執行才有效」的 token 經由 stdin
# 送進 VM 做 docker login，用完即登出 —— VM 上不留任何長效憑證。

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'design*.md'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kevin319/stockwatch
  SERVICE: stockwatch

jobs:
  build:
    runs-on: ubuntu-24.04-arm   # 原生 arm64，與 Oracle A1 相同架構，不需 QEMU 模擬
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest      # 只是跑 ssh，用便宜的 x86 runner 即可
    permissions:
      contents: read
      packages: read
    steps:
      - name: Pull and restart on VM
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # token 走 stdin，不出現在指令列（否則 VM 上 ps 看得到）
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/deploy "$VM_USER@$VM_HOST" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin \
             && cd ~/cloud \
             && docker compose pull $SERVICE \
             && docker compose up -d $SERVICE \
             && docker logout ghcr.io \
             && docker image prune -f"

      - name: Verify
        env:
          SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          sleep 20
          ssh -i ~/.ssh/deploy "$VM_USER@$VM_HOST" \
            "cd ~/cloud && docker compose ps $SERVICE"
